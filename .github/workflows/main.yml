name: Notify Branch Update

on:
  push:
    branches:
      - main
      - development
      - feature/*

jobs:
  send_email:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Send Email via SMTP
        uses: ksatriow/action-mailer@main
        with:
          smtp-server: smtp.gmail.com
          smtp-port: 465
          smtp-secure: true

          from-email: ${{ secrets.SMTP_USERNAME }}
          to-email: "lucaspaiva-lp@proton.me"

          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}

          subject: "📧 Branch Update: ${{ github.ref_name }}"

          html-template: "./.github/templates/branch-update.html"

          template-variables: >
            {
              "branch": "${{ github.ref_name }}",
              "commit": "${{ github.sha }}",
              "author": "${{ github.event.head_commit.author.name }}",
              "message": "${{ github.event.head_commit.message }}",
              "date": "${{ github.event.head_commit.timestamp }}",
              "status": "Updated"
            }
